services:
  postgres:
    image: postgres:16-alpine
    container_name: songswipe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: songswipe
    ports:
      - "5432:5432"
    volumes:
      - songswipe_pg_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  songswipe_pg_data:
